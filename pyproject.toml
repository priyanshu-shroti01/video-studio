[project]
name = "video-pipeline"
version = "0.4.0"
description = "Local-first video production pipeline: local TTS (Kokoro/Piper) -> timeline -> Remotion -> FFmpeg -> QA"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# Runtime deps are deliberately tiny: everything else is the stdlib + ffmpeg/ffprobe + node/Remotion.
dependencies = [
    "av==19.0.2",
    "ctranslate2==4.8.4",
    "edge-tts==7.3.1",
    "faster-whisper==1.2.1",
    "huggingface-hub==2.3.0",
    "kokoro-onnx==0.6.1",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "phonemizer==3.4.0",
    "piper-tts==1.8.0",
    "tokenizers==0.23.3",
]

[project.scripts]
video-pipeline = "pipeline.cli:main"
video-pipeline-mcp = "pipeline.social.mcp_server:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: renders real video through Remotion + FFmpeg (slow, ~1-2 min)",
  "network: needs Microsoft's online Edge TTS service",
  "models: real local TTS/ASR inference (Kokoro/Piper/Whisper); skips if models/voice files are absent",
]
addopts = "-m 'not network' -ra"
